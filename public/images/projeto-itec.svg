<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c1929"/>
      <stop offset="100%" stop-color="#081220"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38abf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0e8ee9" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)"/>
  <!-- Grid -->
  <g opacity="0.06" stroke="#38abf8" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="600"/><line x1="40" y1="0" x2="40" y2="600"/><line x1="80" y1="0" x2="80" y2="600"/>
    <line x1="120" y1="0" x2="120" y2="600"/><line x1="160" y1="0" x2="160" y2="600"/><line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="240" y1="0" x2="240" y2="600"/><line x1="280" y1="0" x2="280" y2="600"/><line x1="320" y1="0" x2="320" y2="600"/>
    <line x1="360" y1="0" x2="360" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/><line x1="440" y1="0" x2="440" y2="600"/>
    <line x1="480" y1="0" x2="480" y2="600"/><line x1="520" y1="0" x2="520" y2="600"/><line x1="560" y1="0" x2="560" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/><line x1="640" y1="0" x2="640" y2="600"/><line x1="680" y1="0" x2="680" y2="600"/>
    <line x1="720" y1="0" x2="720" y2="600"/><line x1="760" y1="0" x2="760" y2="600"/><line x1="800" y1="0" x2="800" y2="600"/>
    <line x1="0" y1="0" x2="800" y2="0"/><line x1="0" y1="40" x2="800" y2="40"/><line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="160" x2="800" y2="160"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="280" x2="800" y2="280"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="360" x2="800" y2="360"/><line x1="0" y1="400" x2="800" y2="400"/><line x1="0" y1="440" x2="800" y2="440"/>
    <line x1="0" y1="480" x2="800" y2="480"/><line x1="0" y1="520" x2="800" y2="520"/><line x1="0" y1="560" x2="800" y2="560"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
  </g>
  <!-- Building sections representing different clients -->
  <!-- TAURUS ARMAS - industrial building -->
  <g stroke="url(#accent3)" stroke-width="1" fill="none" opacity="0.5">
    <rect x="60" y="200" width="180" height="200" rx="2"/>
    <polyline points="60,200 150,140 240,200"/>
    <!-- Factory windows -->
    <rect x="80" y="220" width="30" height="20" rx="1"/><rect x="120" y="220" width="30" height="20" rx="1"/>
    <rect x="160" y="220" width="30" height="20" rx="1"/><rect x="200" y="220" width="20" height="20" rx="1"/>
    <rect x="80" y="250" width="30" height="20" rx="1"/><rect x="120" y="250" width="30" height="20" rx="1"/>
    <rect x="160" y="250" width="30" height="20" rx="1"/><rect x="200" y="250" width="20" height="20" rx="1"/>
    <!-- Industrial pipe/conduit -->
    <line x1="80" y1="290" x2="220" y2="290" stroke-width="2" opacity="0.3"/>
    <line x1="80" y1="310" x2="220" y2="310" stroke-width="2" opacity="0.3"/>
    <line x1="80" y1="330" x2="220" y2="330" stroke-width="2" opacity="0.3"/>
    <!-- Door -->
    <rect x="130" y="340" width="40" height="60" rx="2"/>
    <!-- Crane silhouette -->
    <line x1="150" y1="140" x2="150" y2="100" stroke-width="1.5"/>
    <line x1="150" y1="100" x2="240" y2="100"/>
    <line x1="240" y1="100" x2="240" y2="130" stroke-dasharray="3 2"/>
  </g>
  <!-- KRUPP INDÚSTRIAS - large industrial complex -->
  <g stroke="url(#accent3)" stroke-width="1" fill="none" opacity="0.45">
    <rect x="290" y="180" width="220" height="220" rx="2"/>
    <!-- Sawtooth roof -->
    <polyline points="290,180 330,150 370,180 410,150 450,180 490,150 510,180"/>
    <!-- Large industrial windows -->
    <rect x="310" y="200" width="40" height="30" rx="1"/><rect x="360" y="200" width="40" height="30" rx="1"/>
    <rect x="410" y="200" width="40" height="30" rx="1"/><rect x="460" y="200" width="30" height="30" rx="1"/>
    <rect x="310" y="240" width="40" height="30" rx="1"/><rect x="360" y="240" width="40" height="30" rx="1"/>
    <rect x="410" y="240" width="40" height="30" rx="1"/><rect x="460" y="240" width="30" height="30" rx="1"/>
    <!-- HVAC ducts -->
    <line x1="310" y1="290" x2="490" y2="290" stroke-width="3" opacity="0.2"/>
    <line x1="310" y1="300" x2="490" y2="300" stroke-width="1.5" opacity="0.2"/>
    <!-- Electrical panel -->
    <rect x="320" y="320" width="60" height="80" rx="2"/>
    <circle cx="335" cy="340" r="5"/><circle cx="365" cy="340" r="5"/>
    <circle cx="335" cy="365" r="5"/><circle cx="365" cy="365" r="5"/>
    <line x1="320" y1="385" x2="380" y2="385" stroke-width="0.5"/>
  </g>
  <!-- TERMAS RESORT GRAMADO - resort building -->
  <g stroke="url(#accent3)" stroke-width="1" fill="none" opacity="0.4">
    <rect x="560" y="160" width="200" height="240" rx="3"/>
    <!-- Curved roof -->
    <path d="M560,160 Q660,120 760,160"/>
    <!-- Floor divisions -->
    <line x1="560" y1="200" x2="760" y2="200"/><line x1="560" y1="240" x2="760" y2="240"/>
    <line x1="560" y1="280" x2="760" y2="280"/><line x1="560" y1="320" x2="760" y2="320"/>
    <line x1="560" y1="360" x2="760" y2="360"/>
    <!-- Arched windows -->
    <path d="M580,170 Q580,160 590,160 L610,160 Q620,160 620,170 L620,195 L580,195 Z"/>
    <path d="M640,170 Q640,160 650,160 L670,160 Q680,160 680,170 L680,195 L640,195 Z"/>
    <path d="M700,170 Q700,160 710,160 L730,160 Q740,160 740,170 L740,195 L700,195 Z"/>
    <!-- Regular windows -->
    <g stroke-width="0.5" opacity="0.3">
      <rect x="580" y="210" width="25" height="15" rx="1"/><rect x="620" y="210" width="25" height="15" rx="1"/>
      <rect x="660" y="210" width="25" height="15" rx="1"/><rect x="700" y="210" width="25" height="15" rx="1"/>
      <rect x="580" y="250" width="25" height="15" rx="1"/><rect x="620" y="250" width="25" height="15" rx="1"/>
      <rect x="660" y="250" width="25" height="15" rx="1"/><rect x="700" y="250" width="25" height="15" rx="1"/>
      <rect x="580" y="290" width="25" height="15" rx="1"/><rect x="620" y="290" width="25" height="15" rx="1"/>
      <rect x="660" y="290" width="25" height="15" rx="1"/><rect x="700" y="290" width="25" height="15" rx="1"/>
    </g>
    <!-- Entrance arch -->
    <path d="M620,360 Q660,330 700,360 L700,400 L620,400 Z"/>
    <!-- Pool symbol -->
    <ellipse cx="660" cy="440" rx="60" ry="15" stroke-width="0.6" opacity="0.2"/>
  </g>
  <!-- HVAC / Instalações overlay -->
  <g stroke="#38abf8" stroke-width="0.5" opacity="0.12" stroke-dasharray="6 4">
    <!-- Conduit lines connecting buildings -->
    <path d="M240,400 L290,400"/>
    <path d="M510,400 L560,400"/>
    <path d="M240,350 C280,320 290,350 290,350"/>
    <path d="M510,350 C530,320 560,350 560,350"/>
    <!-- Underground lines -->
    <path d="M150,420 L660,420" stroke-dasharray="2 4"/>
    <path d="M150,430 L660,430" stroke-dasharray="2 4"/>
  </g>
  <!-- Electrical symbols -->
  <g stroke="#38abf8" stroke-width="0.6" fill="none" opacity="0.15">
    <circle cx="150" cy="300" r="8"/><line x1="144" y1="300" x2="156" y2="300"/>
    <circle cx="400" cy="300" r="8"/><line x1="394" y1="300" x2="406" y2="300"/>
    <circle cx="660" cy="300" r="8"/><line x1="654" y1="300" x2="666" y2="300"/>
  </g>
  <!-- Labels -->
  <g fill="#38abf8" font-family="monospace" font-size="8" opacity="0.2">
    <text x="100" y="430" text-anchor="middle">TAURUS ARMAS</text>
    <text x="400" y="430" text-anchor="middle">KRUPP INDÚSTRIAS</text>
    <text x="660" y="470" text-anchor="middle">TERMAS RESORT GRAMADO</text>
  </g>
  <!-- Title block -->
  <g opacity="0.3">
    <rect x="580" y="520" width="200" height="60" rx="3" fill="none" stroke="#38abf8" stroke-width="0.8"/>
    <text x="590" y="540" fill="#38abf8" font-family="monospace" font-size="9">ITEC ENGENHARIA</text>
    <text x="590" y="555" fill="#38abf8" font-family="monospace" font-size="7" opacity="0.6">Instalações Prediais — 2020–2024</text>
    <text x="590" y="570" fill="#38abf8" font-family="monospace" font-size="7" opacity="0.6">Elétrica · Hidráulica · HVAC</text>
  </g>
  <!-- Corner marks -->
  <g stroke="#38abf8" stroke-width="0.5" opacity="0.15">
    <polyline points="20,40 20,20 40,20" fill="none"/>
    <polyline points="760,20 780,20 780,40" fill="none"/>
    <polyline points="780,560 780,580 760,580" fill="none"/>
    <polyline points="40,580 20,580 20,560" fill="none"/>
  </g>
</svg>
