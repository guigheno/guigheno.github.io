<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGlobal" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081220"/>
      <stop offset="50%" stop-color="#0c1929"/>
      <stop offset="100%" stop-color="#081220"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bgGlobal)"/>
  <!-- Fine grid -->
  <g opacity="0.04" stroke="#38abf8" stroke-width="0.3">
    <line x1="0" y1="0" x2="0" y2="800"/><line x1="30" y1="0" x2="30" y2="800"/><line x1="60" y1="0" x2="60" y2="800"/>
    <line x1="90" y1="0" x2="90" y2="800"/><line x1="120" y1="0" x2="120" y2="800"/><line x1="150" y1="0" x2="150" y2="800"/>
    <line x1="180" y1="0" x2="180" y2="800"/><line x1="210" y1="0" x2="210" y2="800"/><line x1="240" y1="0" x2="240" y2="800"/>
    <line x1="270" y1="0" x2="270" y2="800"/><line x1="300" y1="0" x2="300" y2="800"/><line x1="330" y1="0" x2="330" y2="800"/>
    <line x1="360" y1="0" x2="360" y2="800"/><line x1="390" y1="0" x2="390" y2="800"/><line x1="420" y1="0" x2="420" y2="800"/>
    <line x1="450" y1="0" x2="450" y2="800"/><line x1="480" y1="0" x2="480" y2="800"/><line x1="510" y1="0" x2="510" y2="800"/>
    <line x1="540" y1="0" x2="540" y2="800"/><line x1="570" y1="0" x2="570" y2="800"/><line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="630" y1="0" x2="630" y2="800"/><line x1="660" y1="0" x2="660" y2="800"/><line x1="690" y1="0" x2="690" y2="800"/>
    <line x1="720" y1="0" x2="720" y2="800"/><line x1="750" y1="0" x2="750" y2="800"/><line x1="780" y1="0" x2="780" y2="800"/>
    <line x1="810" y1="0" x2="810" y2="800"/><line x1="840" y1="0" x2="840" y2="800"/><line x1="870" y1="0" x2="870" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/><line x1="930" y1="0" x2="930" y2="800"/><line x1="960" y1="0" x2="960" y2="800"/>
    <line x1="990" y1="0" x2="990" y2="800"/><line x1="1020" y1="0" x2="1020" y2="800"/><line x1="1050" y1="0" x2="1050" y2="800"/>
    <line x1="1080" y1="0" x2="1080" y2="800"/><line x1="1110" y1="0" x2="1110" y2="800"/><line x1="1140" y1="0" x2="1140" y2="800"/>
    <line x1="1170" y1="0" x2="1170" y2="800"/><line x1="1200" y1="0" x2="1200" y2="800"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="30" x2="1200" y2="30"/><line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="210" x2="1200" y2="210"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="270" x2="1200" y2="270"/><line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="330" x2="1200" y2="330"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="390" x2="1200" y2="390"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="510" x2="1200" y2="510"/>
    <line x1="0" y1="540" x2="1200" y2="540"/><line x1="0" y1="570" x2="1200" y2="570"/><line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="630" x2="1200" y2="630"/><line x1="0" y1="660" x2="1200" y2="660"/><line x1="0" y1="690" x2="1200" y2="690"/>
    <line x1="0" y1="720" x2="1200" y2="720"/><line x1="0" y1="750" x2="1200" y2="750"/><line x1="0" y1="780" x2="1200" y2="780"/>
  </g>
  <!-- Major grid -->
  <g opacity="0.06" stroke="#38abf8" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="800"/><line x1="120" y1="0" x2="120" y2="800"/>
    <line x1="240" y1="0" x2="240" y2="800"/><line x1="360" y1="0" x2="360" y2="800"/>
    <line x1="480" y1="0" x2="480" y2="800"/><line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="720" y1="0" x2="720" y2="800"/><line x1="840" y1="0" x2="840" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/><line x1="1080" y1="0" x2="1080" y2="800"/>
    <line x1="1200" y1="0" x2="1200" y2="800"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="640" x2="1200" y2="640"/><line x1="0" y1="800" x2="1200" y2="800"/>
  </g>
  <!-- Structural beam cross-section -->
  <g stroke="#38abf8" stroke-width="0.4" fill="none" opacity="0.04">
    <!-- I-beam -->
    <rect x="100" y="200" width="80" height="8"/>
    <rect x="135" y="208" width="10" height="40"/>
    <rect x="100" y="248" width="80" height="8"/>
    <!-- Column -->
    <rect x="900" y="100" width="12" height="120"/>
    <rect x="880" y="90" width="52" height="10"/>
    <rect x="880" y="220" width="52" height="10"/>
    <!-- Foundation -->
    <rect x="500" y="650" width="200" height="40" rx="2"/>
    <line x1="500" y1="660" x2="700" y2="660" stroke-dasharray="8 4"/>
    <!-- Rebar -->
    <circle cx="520" cy="670" r="3"/><circle cx="540" cy="670" r="3"/>
    <circle cx="560" cy="670" r="3"/><circle cx="580" cy="670" r="3"/>
    <circle cx="600" cy="670" r="3"/><circle cx="620" cy="670" r="3"/>
    <circle cx="640" cy="670" r="3"/><circle cx="660" cy="670" r="3"/>
    <circle cx="680" cy="670" r="3"/>
  </g>
  <!-- Architectural floor plan fragment -->
  <g stroke="#38abf8" stroke-width="0.3" fill="none" opacity="0.035">
    <!-- Room outline -->
    <rect x="700" y="400" width="200" height="150"/>
    <!-- Internal walls -->
    <line x1="800" y1="400" x2="800" y2="550"/>
    <line x1="700" y1="475" x2="800" y2="475"/>
    <!-- Door arcs -->
    <path d="M800,475 Q815,475 815,460"/>
    <path d="M750,400 Q750,415 765,415"/>
    <!-- Window symbols -->
    <line x1="720" y1="400" x2="740" y2="400" stroke-width="0.6"/>
    <line x1="720" y1="398" x2="740" y2="398"/>
    <line x1="720" y1="402" x2="740" y2="402"/>
    <!-- Dimensions -->
    <line x1="700" y1="570" x2="900" y2="570" stroke-dasharray="3 2"/>
    <text x="800" y="585" fill="#38abf8" font-family="monospace" font-size="6" text-anchor="middle" opacity="0.5">8.00m</text>
  </g>
  <!-- Scattered engineering notes -->
  <g fill="#38abf8" font-family="monospace" font-size="6" opacity="0.03">
    <text x="50" y="50">SEC A-A' 1:100</text>
    <text x="1100" y="50">REV. 03</text>
    <text x="50" y="780">DWG: STR-001</text>
    <text x="1100" y="780">ESC: 1:50</text>
    <text x="600" y="780">fck = 30 MPa</text>
    <text x="300" y="780">fyk = 500 MPa</text>
  </g>
  <!-- Compass rose -->
  <g stroke="#38abf8" stroke-width="0.4" fill="none" opacity="0.04">
    <circle cx="1150" cy="50" r="15"/>
    <line x1="1150" y1="35" x2="1150" y2="25"/>
    <text x="1150" y="22" fill="#38abf8" font-family="monospace" font-size="6" text-anchor="middle">N</text>
  </g>
  <!-- Corner registration marks -->
  <g stroke="#38abf8" stroke-width="0.4" opacity="0.06">
    <polyline points="30,60 30,30 60,30" fill="none"/>
    <polyline points="1140,30 1170,30 1170,60" fill="none"/>
    <polyline points="1170,740 1170,770 1140,770" fill="none"/>
    <polyline points="60,770 30,770 30,740" fill="none"/>
  </g>
