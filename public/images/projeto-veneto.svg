    <rect x="620" y="185" width="45" height="195" rx="2"/>
    <line x1="620" y1="215" x2="665" y2="215"/><line x1="620" y1="245" x2="665" y2="245"/>
    <line x1="620" y1="275" x2="665" y2="275"/><line x1="620" y1="305" x2="665" y2="305"/>
    <line x1="620" y1="335" x2="665" y2="335"/>
