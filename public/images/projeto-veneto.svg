    <line x1="200" y1="170" x2="245" y2="170"/><line x1="200" y1="200" x2="245" y2="200"/>
    <line x1="200" y1="230" x2="245" y2="230"/><line x1="200" y1="260" x2="245" y2="260"/>
    <line x1="200" y1="290" x2="245" y2="290"/><line x1="200" y1="320" x2="245" y2="320"/>
    <line x1="200" y1="350" x2="245" y2="350"/>
