    <rect x="260" y="170" width="45" height="210" rx="2"/>
    <line x1="260" y1="200" x2="305" y2="200"/><line x1="260" y1="230" x2="305" y2="230"/>
    <line x1="260" y1="260" x2="305" y2="260"/><line x1="260" y1="290" x2="305" y2="290"/>
    <line x1="260" y1="320" x2="305" y2="320"/><line x1="260" y1="350" x2="305" y2="350"/>
