    <line x1="140" y1="190" x2="185" y2="190"/><line x1="140" y1="220" x2="185" y2="220"/>
    <line x1="140" y1="250" x2="185" y2="250"/><line x1="140" y1="280" x2="185" y2="280"/>
    <line x1="140" y1="310" x2="185" y2="310"/><line x1="140" y1="340" x2="185" y2="340"/>
