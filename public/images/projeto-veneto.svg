    <rect x="500" y="165" width="45" height="215" rx="2"/>
    <line x1="500" y1="195" x2="545" y2="195"/><line x1="500" y1="225" x2="545" y2="225"/>
    <line x1="500" y1="255" x2="545" y2="255"/><line x1="500" y1="285" x2="545" y2="285"/>
    <line x1="500" y1="315" x2="545" y2="315"/><line x1="500" y1="345" x2="545" y2="345"/>
