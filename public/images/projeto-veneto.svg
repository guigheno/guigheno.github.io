    <rect x="560" y="175" width="45" height="205" rx="2"/>
    <line x1="560" y1="205" x2="605" y2="205"/><line x1="560" y1="235" x2="605" y2="235"/>
    <line x1="560" y1="265" x2="605" y2="265"/><line x1="560" y1="295" x2="605" y2="295"/>
    <line x1="560" y1="325" x2="605" y2="325"/><line x1="560" y1="355" x2="605" y2="355"/>
