    <line x1="320" y1="180" x2="365" y2="180"/><line x1="320" y1="210" x2="365" y2="210"/>
    <line x1="320" y1="240" x2="365" y2="240"/><line x1="320" y1="270" x2="365" y2="270"/>
    <line x1="320" y1="300" x2="365" y2="300"/><line x1="320" y1="330" x2="365" y2="330"/>
    <line x1="320" y1="360" x2="365" y2="360"/>
