    <line x1="440" y1="175" x2="485" y2="175"/><line x1="440" y1="205" x2="485" y2="205"/>
    <line x1="440" y1="235" x2="485" y2="235"/><line x1="440" y1="265" x2="485" y2="265"/>
    <line x1="440" y1="295" x2="485" y2="295"/><line x1="440" y1="325" x2="485" y2="325"/>
    <line x1="440" y1="355" x2="485" y2="355"/>
