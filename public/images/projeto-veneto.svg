    <line x1="380" y1="185" x2="425" y2="185"/><line x1="380" y1="215" x2="425" y2="215"/>
    <line x1="380" y1="245" x2="425" y2="245"/><line x1="380" y1="275" x2="425" y2="275"/>
    <line x1="380" y1="305" x2="425" y2="305"/><line x1="380" y1="335" x2="425" y2="335"/>
