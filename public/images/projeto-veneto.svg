  <!-- Lake -->
  <ellipse cx="400" cy="450" rx="280" ry="60" fill="none" stroke="#38abf8" stroke-width="0.8" opacity="0.25"/>
  <ellipse cx="400" cy="450" rx="220" ry="45" fill="none" stroke="#38abf8" stroke-width="0.5" opacity="0.15"/>
  <!-- Trees (circles) -->
  <g stroke="#38abf8" stroke-width="0.6" fill="none" opacity="0.15">
    <circle cx="60" cy="400" r="25"/><circle cx="90" cy="410" r="18"/>
    <circle cx="710" cy="390" r="22"/><circle cx="740" cy="405" r="20"/>
    <circle cx="350" cy="420" r="15"/><circle cx="450" cy="415" r="17"/>
    <circle cx="130" cy="420" r="14"/><circle cx="670" cy="415" r="16"/>
  </g>
  <!-- Dimension lines -->
  <g stroke="#38abf8" stroke-width="0.4" opacity="0.2" stroke-dasharray="4 3">
    <line x1="80" y1="130" x2="665" y2="130"/>
    <line x1="75" y1="135" x2="75" y2="125"/>
    <line x1="670" y1="135" x2="670" y2="125"/>
  </g>
  <!-- Dimension text -->
  <text x="370" y="125" fill="#38abf8" opacity="0.2" font-family="monospace" font-size="10" text-anchor="middle">10 TORRES</text>
  <!-- Ground line -->
  <line x1="40" y1="380" x2="760" y2="380" stroke="#38abf8" stroke-width="0.5" opacity="0.15"/>
  <!-- Title block -->
  <g opacity="0.3">
    <rect x="580" y="520" width="200" height="60" rx="3" fill="none" stroke="#38abf8" stroke-width="0.8"/>
    <text x="590" y="540" fill="#38abf8" font-family="monospace" font-size="9">VÊNETO BY HASAM</text>
    <text x="590" y="555" fill="#38abf8" font-family="monospace" font-size="7" opacity="0.6">Gramado/RS — 2025</text>
    <text x="590" y="570" fill="#38abf8" font-family="monospace" font-size="7" opacity="0.6">106 unidades · 65m²–133m²</text>
  </g>
  <!-- Corner marks -->
  <g stroke="#38abf8" stroke-width="0.5" opacity="0.15">
    <polyline points="20,40 20,20 40,20" fill="none"/>
    <polyline points="760,20 780,20 780,40" fill="none"/>
    <polyline points="780,560 780,580 760,580" fill="none"/>
    <polyline points="40,580 20,580 20,560" fill="none"/>
  </g>
